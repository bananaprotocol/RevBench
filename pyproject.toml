[project]
name = "revbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "accelerate>=1.12.0",
  "av==14.2.0",
  "bitsandbytes",
  "datasets>=2.14.0",
  "einops==0.8.1",
  "fairscale==0.4.13",
  "gpustat==1.1",
  "hf-transfer>=0.1.9",
  "higher==0.2.1",
  "hydra-core==1.3.2",
  "importlib-metadata==8.7.0",
  "iopath==0.1.10",
  "ipython>=9.8.0",
  "marimo>=0.18.2",
  "matplotlib==3.10.7",
  "nbformat>=5.10.4",
  "nltk==3.6.5",
  "numpy==2.2.6",
  "omegaconf==2.3.0",
  "openai==2.8.1",
  "opencv-python==4.12.0.88",
  "pandas==2.3.3",
  "peft==0.18.0",
  "pyarrow==18.1.0",
  "pytorch-triton-rocm>=3.4.0",
  "pyyaml==6.0",
  "qwen-vl-utils==0.0.10",
  "rouge==1.0.1",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "sentence-transformers==3.2.1",
  "sentencepiece==0.2.0",
  "timm==1.0.22",
  "tokenizers==0.22.1",
  "torch==2.9.1",
  "torchao>=0.13.0",
  "torchvision>=0.23.0",
  "tqdm==4.62.3",
  "transformers==4.57.1",
  "trl>=0.10.1",
  "xformers>=0.0.32.post2",
  "zhipuai==2.1.5.20250415",
]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-rocm" },
]
torchvision = [
  { index = "pytorch-rocm" },
]
pytorch-triton-rocm = [
  { index = "pytorch-rocm" },
]
xformers = [
  { index = "pytorch-rocm" },
]
bitsandbytes = { workspace = true }

[tool.uv.workspace]
members = [
    "bitsandbytes",
    "bnb",
]
